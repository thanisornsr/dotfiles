# Vi copypaste mode after 2.4
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
#set-window-option -g mode-keys vi
#bind-key -T vi-copy 'v' begin-selection
#bind-key -T vi-copy 'y' copy-selection

# Set base-index to 1 to start with 1 since 0 is behind 9
set -g base-index 1

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# reload config
bind r source ~/.tmux.conf\; display "~/.tmux.conf sourced!"

# Automatic window naming
set-window-option -g automatic-rename

# Reconfigure prefix key to Ctrl-a
set-option -g prefix C-a
unbind-key C-b
bind-key a send-prefix

# Toggling status line
bind-key q set-option status

# Set mouse mode on
setw -g mouse on

# Automatic window re-numbering
set-option -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore session เมื่อเปิด tmux
set -g @continuum-restore 'on'

# ต้องอยู่บรรทัดเดียวกัน; argument อย่าง claude code ต้องมี double quotes ครอบข้างใน
set -g @resurrect-processes 'claude "claude code"'

# Initialize TMUX plugin manager (บรรทัดนี้ต้องอยู่ล่างสุดเสมอ)
run '~/.tmux/plugins/tpm/tpm'
